
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Save Links</title>

    <link rel="shortcut icon" href="../images/favicon.ico" />
    <link rel="icon" type="image/vnd.microsoft.icon" href="../images/favicon.ico">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <link rel="icon" href="../images/favicon.ico" />
    
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <sidebar class="sidebar">
      <div class="sidebar__item sidebar__title">Save Links</div>
      <div class="sidebar__item sidebar__links">
        <div class="sidebar__subtitle">Links</div>
        <div class="sidebar__no-category btn">Sem categoria</div>
        <div class="sidebar__favorities btn">Favoritos</div>
      </div>
      <div class="sidebar__item sidebar__categories">
        <div class="sidebar__subtitle">Categorias</div>
        <div class="sidebar__category-add btn">Adicionar categoria (+)</div>
        <div class="group__category">
          <div class="btn category__select">Social (0)</div>
        </div>
      </div>
      <div class="sidebar__item sidebar__plus">
        <div class="sidebar__subtitle">Main</div>
        <div class="btn">Rascunho</div>
        <div class="btn">Sair</div>
      </div>
      <div class="sidebar__item sidebar__describe">
        <div>0 links e 0 categorias</div>
      </div>
    </sidebar>
    <main>
      <div class="row-block input__search">
        <input type="text" placeholder="Buscar">
      </div>
      <div class="row-block input__url">
        <input type="text" placeholder="http:// ou https://">
      </div>
      <div class="group__searched">
        <div class="link">
          <div class="link__icon">
            <img src="https://www.google.com/s2/favicons?domain=https://www.youtube.com/channel/UCSzNkSeerKb2e9FM1knbBqA/videos" alt="url-icon">
          </div>
          <div class="link__title">WhatsApp Web</div>
        </div>
      </div>
      <div class="row-block main__category">Sem categoria</div>
      <div class="group__sub-category">
        <div class="sub-category">
          <div class="sub-category__title">
            Game X
          </div>
        </div>
      </div>
      <div class="group__link">
        <div class="link">
          <div class="link__icon">
            <img src="https://www.google.com/s2/favicons?domain=https://www.youtube.com/channel/UCSzNkSeerKb2e9FM1knbBqA/videos" alt="url-icon">
          </div>
          <div class="link__title">WhatsApp Web</div>
        </div>
      </div>
    </main>
    <script src="storage.js"></script>
    <script src="utils.js"></script>

    <!-- <script src="sample-links.js"></script> -->
    <script src="../data/all-links.js"></script>
    <script src="globals.js"></script>

    <script src="script.js"></script>
  </body>
</html>
